name: Validate cookbook

on:
  pull_request:
    paths:
      - "recipes/**"
      - "schema/**"
      - "scripts/**"
      - ".github/workflows/validate.yml"
  push:
    branches:
      - main
    paths:
      - "recipes/**"
      - "schema/**"
      - "scripts/**"
      - ".github/workflows/validate.yml"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install schema validator
        run: python -m pip install check-jsonschema
      - name: Validate recipes
        run: check-jsonschema --schemafile schema/recipe-v1.schema.json recipes/*.json
      - name: Generate catalogue
        run: bash scripts/build-catalog.sh
      - name: Publish generated catalogue
        if: github.event_name == 'push'
        run: |
          if git diff --quiet -- catalog.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog.json
          git commit -m "Regenerate catalogue"
          git push
