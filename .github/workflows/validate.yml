name: Validate cookbook

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install schema validator
        run: python -m pip install check-jsonschema
      - name: Validate recipes
        run: check-jsonschema --schemafile schema/recipe-v1.schema.json recipes/*.json
      - name: Generate catalogue
        run: bash scripts/build-catalog.sh
      - name: Check generated catalogue
        run: git diff --exit-code -- catalog.json
